version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: raisbook-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - media-network

  backend:
    build: ./backend
    container_name: raisbook-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/raisbook
      - JWT_SECRET=your_jwt_secret_key_here_change_this_in_production
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - media-network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: raisbook-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - media-network

volumes:
  mongodb_data:

networks:
  media-network:
    driver: bridge
