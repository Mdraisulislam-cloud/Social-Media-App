# we should write this command in cli: az aks get-credentials -g MyResourceGroup -n myaks --admin --file kubeconfig
name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build-backend
        run: |
          docker login myacr1971.azurecr.io -u myacr1971 -p 79+j8NAdv2m/AJlb9rSL4eWCftcQ3LR9tvSCnQRmCc+ACRA8cmBI
          docker build -t myacr1971.azurecr.io/myapp-backend:v1 -f Dockerfile .
          docker push myacr1971.azurecr.io/myapp-backend:v1
      - name: build-frontend
        run: |
          docker login myacr1971.azurecr.io -u myacr1971 -p 79+j8NAdv2m/AJlb9rSL4eWCftcQ3LR9tvSCnQRmCc+ACRA8cmBI
          docker build -t myacr1971.azurecr.io/myapp-frontend:v1 -f Dockerfile-frontend .
          docker push myacr1971.azurecr.io/myapp-frontend:v1

  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl config get-contexts
          kubectl apply -f deployment.yaml
          kubectl rollout restart deployment/myapp-backend
          kubectl rollout restart deployment/myapp-frontend
